<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4ff4a"/>
      <stop offset="1" stop-color="#8fe53a"/>
    </linearGradient>
    <clipPath id="ring"><circle cx="256" cy="256" r="150"/></clipPath>
  </defs>
  <!-- token-style disc -->
  <circle cx="256" cy="256" r="248" fill="#0a0b0a"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#1d201b" stroke-width="2"/>
  <!-- the null ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#lime)" stroke-width="40"/>
  <!-- the slash is a wave: good vibes passing through, everything else nulled -->
  <path d="M92 348 C 160 348, 180 164, 256 256 S 352 348, 420 164"
        fill="none" stroke="#0a0b0a" stroke-width="64" stroke-linecap="round"/>
  <path d="M92 348 C 160 348, 180 164, 256 256 S 352 348, 420 164"
        fill="none" stroke="url(#lime)" stroke-width="30" stroke-linecap="round"/>
</svg>
